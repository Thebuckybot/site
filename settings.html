<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- Content Security Policy. Als <meta> omdat GitHub Pages geen headers laat
       zetten; frame-ancestors (clickjacking) werkt daardoor niet. Moet vóór elk
       script en stylesheet staan. Zie bucky1.0/tests/test_site_csp.py. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://cdn.discordapp.com; connect-src https://api.buckybot.app; base-uri 'self'; form-action 'none'; object-src 'none'" />
  <title>Server Settings</title>
  <link rel="stylesheet" href="settings.css" />
<script type="module" src="js/features.js"></script>
</head>
<body>
  <!-- DEPRECATED PAGE. The new Security v2 Center (security.html) is the active
       dashboard; this legacy page is kept only for the shadow-migration period
       and is no longer linked from the main dashboard. Remove at GA cutover. -->
  <div id="v2-deprecation">
    <span>You're on the legacy Security page. The new <strong>Security Center</strong> is now available.</span>
    <a data-feature="security_center" id="v2-open" href="security.html">Open Security v2 →</a>
  </div>
  <!-- De stijl van deze balk staat onderaan settings.css en het zetten van de
       guild_id op de knop in js/settings.js: de CSP staat geen inline stijl of
       script toe. -->
  <header id="guild-header">
    <div class="guild-info">
      <img id="guild-icon" alt="Guild Icon" />
      <h1 id="guild-name"></h1>
    </div>
    <a data-feature="dashboard" href="dashboard.html" class="back-button">← Dashboard</a>
    <a id="soc-link" class="soc-button back-button">SOC Dashboard</a>
  </header>

  <main>
    <section class="card">
      <h2>🔒 Security Settings</h2>
      <div id="anti-mode-toggles">
        </div>
      <div class="punishment-settings">
          <h3>Punishment Settings</h3>
          <div id="punishment-options">
              </div>
      </div>
    </section>

  <section class="card">

    <h2>⚙️ Command Controls</h2>

    <p class="card-subtitle">
      Enable or disable commands and modules for this server.
    </p>

    <div id="command-tree"></div>

  </section>

    <button id="save-settings">Save</button>
  </main>

  <script src="js/settings.js" type="module"></script>
  <script src="js/dashboard.js" type="module"></script>

</body>
</html>
