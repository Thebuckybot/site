<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bucky Server Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/security.css" />
  <link rel="stylesheet" href="css/server.css" />
<script type="module" src="js/features.js"></script>
</head>
<!-- Dezelfde shell als het Security Center (sec-*), zodat beide afdelingen één
     product blijven: dezelfde lade op een telefoon, dezelfde toasts, dezelfde
     focusregels. Wat verschilt zit in css/server.css en in de zijbalk. -->
<body class="sec-body srv-body" data-tour="server">
  <div id="sec-app" class="sec-app" aria-busy="true">

    <aside class="sec-sidebar" id="sec-sidebar">
      <div class="sec-brand">
        <span class="sec-brand-mark srv-mark" aria-hidden="true">S</span>
        <span>Server Center</span>
      </div>
      <nav class="sec-nav" id="sec-nav" aria-label="Server sections"></nav>
      <div class="sec-sidebar-foot">
        <a class="sec-link" href="dashboard.html">Switch server</a>
        <button class="sec-link sec-link-btn" type="button" data-tour-start title="Take the tour of this page again">Tour</button>
      </div>
    </aside>

    <main class="sec-main">
      <header class="sec-topbar">
        <button class="sec-burger" id="sec-burger" aria-label="Toggle navigation">&#9776;</button>
        <div class="sec-breadcrumb" id="sec-breadcrumb"></div>
        <div class="sec-top-actions">
          <!-- De afdelingswissel. Twee knoppen en geen dropdown: er zijn er twee,
               en een dropdown verbergt waar je NIET bent. -->
          <div class="srv-dept" role="group" aria-label="Dashboard section">
            <a class="srv-dept-btn" id="srv-to-security" href="#">Security</a>
            <span class="srv-dept-btn is-active" aria-current="page">Server</span>
          </div>
          <span class="sec-guild" id="sec-guild-name"></span>
          <button class="sec-btn sec-btn-ghost" id="sec-refresh" title="Refresh">Refresh</button>
        </div>
      </header>
      <div class="sec-content" id="sec-content" tabindex="-1">
        <div class="sec-loading">Loading…</div>
      </div>
    </main>

    <div class="sec-scrim" id="sec-scrim" aria-hidden="true"></div>
  </div>

  <div class="sec-toast-host" id="sec-toast-host" aria-live="polite"></div>
  <div class="sec-modal-host" id="sec-modal-host" aria-hidden="true"></div>

  <script type="module" src="js/server/app.js"></script>
  <script type="module" src="js/tour.js"></script>
</body>
</html>
