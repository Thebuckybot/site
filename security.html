<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Content Security Policy. Als <meta> omdat GitHub Pages geen headers laat
       zetten; frame-ancestors (clickjacking) werkt daardoor niet. Moet vóór elk
       script en stylesheet staan. Zie bucky1.0/tests/test_site_csp.py.
       Chart.js: precies dit ene bestand van cdnjs, geen hele CDN. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js; style-src 'self'; font-src 'self'; img-src 'self' https://cdn.discordapp.com; connect-src https://api.buckybot.app; base-uri 'self'; form-action 'none'; object-src 'none'" />
  <title>Bucky Security Center</title>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/security.css" />
<script type="module" src="js/features.js"></script>
  <script src="js/glas.js"></script>
</head>
<body class="sec-body" data-tour="security">
  <!-- Dashboard v2: het filter voor de vervorming van het glas. Alleen gebruikt
       als js/glas.js de klasse glas-vervorming zet (Chromium). Neemt geen ruimte in. -->
  <svg class="dv2-filters" aria-hidden="true" focusable="false">
    <filter id="dv2-vervorm" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="ruis"/>
      <feGaussianBlur in="ruis" stdDeviation="2" result="zacht"/>
      <feDisplacementMap in="SourceGraphic" in2="zacht" scale="38" xChannelSelector="R" yChannelSelector="G" result="verbogen"/>
      <feGaussianBlur in="verbogen" stdDeviation="9"/>
    </filter>
  </svg>

  <div id="sec-app" class="sec-app" aria-busy="true">
    <!-- Sidebar -->
    <!-- DASHBOARD V2 (3-11-2026): wisselen gebeurt in het zijpaneel, net als in het
         Server Center. Bovenaan de server (pijltje naar de serverkeuze), onderin het
         andere centrum en de gebruiker met Log out. -->
    <aside class="sec-sidebar" id="sec-sidebar">
      <button type="button" class="sec-brand dv2-server" id="dv2-server-knop" aria-haspopup="true" aria-expanded="false" aria-controls="dv2-wissel">
        <span class="sec-guild" id="sec-guild-name"></span>
        <span class="dv2-centrum-naam">Security Center</span>
        <svg class="dv2-ico dv2-server-pijl" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        <span class="dv2-sr">Switch server</span>
      </button>
      <nav class="sec-nav" id="sec-nav" aria-label="Security sections"></nav>
      <div class="sec-sidebar-foot">
        <a class="dv2-ander" id="sec-to-server" href="#">
          <svg class="dv2-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
          <span>Server Center</span>
          <svg class="dv2-ico dv2-ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
        <div class="dv2-ik">
          <span class="dv2-avatar" id="dv2-avatar" aria-hidden="true"></span>
          <span class="dv2-ik-naam" id="dv2-ik-naam"></span>
          <button class="sec-link sec-link-btn" type="button" data-tour-start title="Take the tour of this page again">Tour</button>
          <button class="sec-link sec-link-btn dv2-uit" id="dv2-uitloggen" type="button">Log out</button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="sec-main">
      <header class="sec-topbar">
        <button class="sec-burger" id="sec-burger" aria-label="Open navigation">
          <svg class="dv2-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="sec-breadcrumb" id="sec-breadcrumb"></div>
        <div class="sec-top-actions">
          <label class="dv2-zoek">
            <svg class="dv2-ico dv2-ico-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <span class="dv2-sr">Search security settings</span>
            <input id="dv2-zoek" type="search" placeholder="Search security settings" autocomplete="off" spellcheck="false" />
            <kbd aria-hidden="true">/</kbd>
          </label>
          <button class="sec-btn sec-btn-ghost" id="sec-refresh" title="Refresh">
            <svg class="dv2-ico dv2-ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
            <span>Refresh</span>
          </button>
        </div>
      </header>

      <main class="sec-content" id="sec-content" tabindex="-1">
        <div class="sec-loading">Loading Security Center…</div>
      </main>
    </div>
    <div class="sec-scrim" id="sec-scrim" aria-hidden="true"></div>
  </div>

  <!-- DASHBOARD V2: de serverwisselaar onder de servernaam in het zijpaneel.
       Buiten het paneel, omdat dat glas afknipt; js/dashboard_zij.js zet hem op zijn plek. -->
  <div class="dv2-wissel" id="dv2-wissel" hidden>
    <p class="dv2-wissel-kop" id="dv2-wissel-kop">Your servers</p>
    <ul class="dv2-wissel-lijst" id="dv2-wissel-lijst" aria-labelledby="dv2-wissel-kop"></ul>
    <a class="dv2-wissel-alle" id="dv2-wissel-alle" href="dashboard.html" data-feature="dashboard">
      <svg class="dv2-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
      <span>All servers</span>
    </a>
  </div>

  <div class="sec-toast-host" id="sec-toast-host" aria-live="polite"></div>
  <div class="sec-modal-host" id="sec-modal-host" aria-hidden="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script type="module" src="js/security/app.js"></script>
  <link rel="stylesheet" href="css/tour.css" />
  <script type="module" src="js/tour.js"></script>
</body>
</html>
