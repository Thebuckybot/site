<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<!-- Content Security Policy, zelfde als arcade.html (daar staat de volledige
     uitleg). style-src-attr 'unsafe-inline' omdat de VM venstermaten en kleuren
     als style-attribuut in haar innerHTML-sjablonen zet; <style>-blokken en
     inline scripts blijven verboden. Zie bucky1.0/tests/test_site_csp.py. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: https://cdn.discordapp.com https://media.discordapp.net; connect-src https://api.buckybot.app; base-uri 'self'; form-action 'none'; object-src 'none'">
<title>Profielpagina harnas</title>
<link rel="stylesheet" href="/vm/styles/vm.css">
<link rel="stylesheet" href="__profile_harness.css">
</head>
<body>
<div id="status">bezig…</div>
<div id="frame"></div>

<!--
    HARNAS VOOR bucky://profile.

    Dit bestand hoort NIET bij de productiepagina; het staat naast
    __harness.html, dat hetzelfde doet voor de OrgApp. Het laadt de echte
    profile.js als module - dus een syntaxfout laat dit harnas meteen omvallen,
    wat precies de bug is waarvoor het bestaat - en rendert de zelfweergave met
    een gestubde gateway, zodat er geen backend en geen Discord-sessie nodig is.
-->
<script type="module" src="__profile_harness.js"></script>
</body>
</html>
