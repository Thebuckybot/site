<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Content Security Policy. Als <meta> omdat GitHub Pages geen headers laat
       zetten; frame-ancestors (clickjacking) werkt daardoor niet. Moet vóór elk
       script en stylesheet staan. Zie bucky1.0/tests/test_site_csp.py.
       img-src: avatars en bijlagen van Discord. Een plaatje van een andere host
       wordt geblokkeerd en valt terug op de bestandskaart (transcript.js). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https://cdn.discordapp.com https://media.discordapp.net; connect-src https://api.buckybot.app; base-uri 'self'; form-action 'none'; object-src 'none'" />
  <!-- Een transcript hoort niet in een zoekmachine, ook niet de lege pagina. -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Ticket transcript · Bucky</title>
  <!-- Licht/donker: blokkerend en vóór de stylesheets, zodat het thema vaststaat
       voor de eerste tekening (geen flits). Zie js/thema.js. -->
  <script src="js/thema.js"></script>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/thema.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/transcript.css" />
</head>
<!-- De pagina is leeg tot js/transcript.js hem vult. Alles wat uit een ticket
     komt wordt daar met textContent gezet en nooit als HTML: zie
     bucky1.0/tests/test_site_html_injectie.py en test_transcript_pagina.py. -->
<body class="tr-body">
  <header class="tr-top">
    <a class="tr-brand" href="index.html" aria-label="Bucky home">
      <span class="tr-mark" aria-hidden="true">B</span>
      <span>Bucky</span>
    </a>
    <span class="tr-top-title">Ticket transcript</span>
    <span class="tr-top-spacer"></span>
    <span id="tr-view" class="tr-pill" hidden></span>
    <button type="button" class="thema-knop" data-thema-knop aria-label="Theme">
      <svg class="ic-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path class="vol" d="M12 4a8 8 0 0 1 0 16z"/></svg>
      <svg class="ic-licht" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ic-donker" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 7 7 0 1 0 20 14.5z"/></svg>
    </button>
  </header>
  <main id="tr-main" class="tr-main" aria-busy="true" tabindex="-1">
    <p class="tr-state">Loading…</p>
  </main>
  <footer class="tr-foot">
    Bucky keeps a ticket transcript for 48 hours after the ticket closes, then deletes it.
    <a href="privacy.html">Privacy</a>
  </footer>
  <script type="module" src="js/transcript.js"></script>
</body>
</html>
