<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Content Security Policy. three.js komt van esm.sh; de Draco-decoder haalt
     zijn wasm-bestand bij gstatic op (connect-src), draait in een worker uit
     een blob: (worker-src) en compileert WebAssembly - dat is 'wasm-unsafe-eval',
     wat alleen WebAssembly toestaat en geen JavaScript-eval. GLTFLoader haalt de
     texturen uit de GLB op met fetch(blob:) (connect-src blob:), en three.js
     test webp-ondersteuning met een data:-plaatje (img-src data:). Gemeten op
     28-9-2026: zonder één van deze komen er schendingen of laadt Draco niet. Zie bucky1.0/tests/test_site_csp.py. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://esm.sh 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self' blob: https://www.gstatic.com; worker-src blob:; base-uri 'self'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Yggdrasil V12 — Runtime Validator</title>
<link rel="stylesheet" href="ygg_validate.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h1>Yggdrasil V12 — runtime validator</h1>
  <div>Shot: <span id="shotname">loading…</span></div>
  <div class="row" id="shots"></div>
  <div class="row">
    <button id="liftBtn">⏯ lift</button>
    <button id="leakBtn">sky-leak test</button>
    <button id="bgBtn">bg: sky</button>
    <button id="orbitHint">drag = orbit</button>
  </div>
  <div id="status">booting…</div>
  <div id="leak"></div>
</div>
<div id="err"></div>
<script type="module" src="ygg_validate.js"></script>
</body>
</html>
